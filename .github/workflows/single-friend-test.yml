name: Single-friend delivery test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      HEADLESS: "true"
      TRACE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Select one configured friend
        env:
          DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          config = json.loads(os.environ["DOUYIN_CONFIG"])
          friends = config["friends"]
          if len(friends) != 9 or "targets" in config or Path("config/accounts.json").exists():
              raise SystemExit("Unexpected configuration, stopping without sending")
          config["friends"] = [friends[1]]
          config["messages"] = [{"type": "text", "value": "自动续火花中..."}]
          Path("config.json").write_text(json.dumps(config))
          PY
      - run: python run.py
